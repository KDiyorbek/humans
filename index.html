<!DOCTYPE html>
<html lang="uz-UZ">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" sizes="228x228" href="https://humans.uz/app-icons/coast-228x228.png">

    <script src=""></script>
    <title>💛</title>

          <option value="*105#">to'liq cheksizlikni Uch kunga ulash</option>

          <option value="*107#">Gigabayt va Daqiqa qoldig'ini tekshirish</option>
          <option value="*110#">Hisob va Keshbek balansini tekshirish</option>
          <option value="*111#">cheksiz Ilovalarni ulash</option>
          <option value="*113#">Keshbekdan foydalanishni o'chirish/yoqish</option>
          <option value="*114#">kamroq/ko'proq Gigabayt va Daqiqali tarifni ulash</option>
          <option value="*115#">bepul "TEKIN" tarifini ulash</option>
          <option value="*116#">ulangan kartadan Avto-to'lovni o'chirish/yoqish</option>
          <option value="*117#">joriy tarifga Daqiqa yoki Gigabayt'ni ulash</option>
          <option value="*118#">joriy Tarifni (arzonroqga) o'zgartirish</option>

          <option value="*122#">hoziroq tarifni cheksiz Daqiqa va GB-ga o'zgartirish</option>
          <option value="*123#">hoziroq "Super VIP" tarifiga o'zgartirish</option>
          <option value="*555#">umrbod cheksiz "Super VIP doimiy" tarifini ulash</option>
          <option value="*777#">ikki oyni to'lash, va +1 oylik tarifni Sovg'aga olish</option>
        </optgroup>
      </select>
    </p>
    <p id="display">* aloqa markazi:  <a href="tel:1234">1234</a>.</p>
    <hr>
    <div class="flex-container">
      <div class="flex-1">
        <a href="https://apps.humans.uz/auth/choose_number/full">
          <button type="button">
            <i class="bi bi-phone"><br><br></i>Raqam tanlash
          </button>
        </a>
      </div>
      <div class="flex-2">
        <a href="https://apps.humans.uz/telecom">
          <button type="button">
            <i class="bi bi-sim"><br><br></i>Mening raqamim
          </button>
        </a>
      </div>
      <div class="flex-3">
        <a href="https://apps.humans.uz/auth/top_up">
          <button type="button">
            <i class="bi bi-plus-circle-fill"><br><br></i>Hisobni to'ldirish
          </button>
        </a>
      </div>
      <div class="flex-4">
        <a href="https://apps.humans.uz/auth/choose_tariff">

        </a>
      </div>
      <div class="flex-8">

          <button type="button">
            <i class="bi bi-cash-coin"><br><br></i>To'lovlar
          </button>
        </a>
      </div>
      <div class="flex-9">

          <button type="button">

      <div class="flex-10">

          <button type="button">

        </a>
      </div>
      <div class="flex-12">

      </div>
      <div class="flex-14">
        <a href="https://apps.humans.uz/support">
          <button type="button">
            <i class="bi bi-chat-text"><br><br></i>Aloqa xizmati
          </button>
        </a>
      </div>
      <div class="flex-15">
        <a href="https://apps.humans.uz/settings">
          <button type="button">
            <i class="bi bi-person-gear"><br><br></i>Sozlamalar
          </button>
        </a>
      </div>

    <div class="tg">
      <button>
        <a href="page/" target="_self">HUMANS sayti</a> 
      </button>
      <p id="note">← xizmatlardan qulay va oson foydalaning!</p>

    <script>
    function myFun() {
      var x = document.getElementById("mySelect").value;
      document.getElementById("display").innerHTML = "📞 " + x + " -ni tering";
    }
    </script>
